services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradepilot_test
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: tradepilot
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepilot -d tradepilot_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
